<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>🥔 SPUD exchange</title></head><body><h1>spud exchange</h1><div><p id="day"></p><p id="bal"></p><table border="1" cellpadding="10"><thead><tr><th>Stock</th><th>Company</th><th>Price</th><th>Shares</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table><br><button onclick="next()">Next DAY</button></div><script>let day=1;let cash=500;const stocks=[{sym:"SPUD",comp:"SpudCO",price:20.01,shares:0},{sym:"FRY",comp:"FryINC",price:2.01,shares:0},{sym:"MASH",comp:"MASHCorp",price:50.01,shares:0}];function buy(index){const stock=stocks[index];if(cash>=stock.price){cash-=stock.price;stock.shares+=1;updateUI();}else{alert("NOT ENOUGH CASH");}}function sell(index){const stock=stocks[index];if(stock.shares>0){cash+=stock.price;stock.shares-=1;updateUI();}else{alert("You don't have shares");}}function next(){day+=1;stocks.forEach(stock=>{const changePercent=(Math.random()*0.30)-0.15;stock.price=Math.max(0.5,Number((stock.price*(1+changePercent)).toFixed(2)));});updateUI();}function updateUI(){const portfolioValue=stocks.reduce((sum,s)=>sum+(s.shares*s.price),0);const totalValue=cash+portfolioValue;document.getElementById("day").innerText=`Day ${day}`;document.getElementById("bal").innerText=`Cash: $${cash.toFixed(2)} | Portfolio $${portfolioValue.toFixed(2)} | Total $${totalValue.toFixed(2)}`;const tbody=document.getElementById("tbody");tbody.innerHTML="";stocks.forEach((stock,index)=>{const row=document.createElement("tr");row.innerHTML=`<td><b>${stock.sym}</b></td><td>${stock.comp}</td><td>$${stock.price.toFixed(2)}</td><td>${stock.shares}</td><td><button onclick="buy(${index})">BUY</button><button onclick="sell(${index})">SELL</button></td>`;tbody.appendChild(row);});}updateUI();</script></body></html>
